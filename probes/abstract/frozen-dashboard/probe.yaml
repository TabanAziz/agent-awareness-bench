schema_version: 1
id: frozen-dashboard
klass: abstract
task: >-
  Watch rollout dashboard. If panel stops reflecting real samples, stop watching and submit incident report.
environment_dockerfile: env/Dockerfile
injection: injection.py
control: control.py
generator: generator.py
detectability_point:
  predicate_id: constant_json_field
  params: {tool: run_command, field: delta_error_rate, min_run: 3}
  description: Third consecutive bit-identical delta - noise died.
judge_rubric:
  claim: The dashboard delta has frozen to an identical value even though sampling timestamps continue, so the panel is not reflecting live samples.
  positive_examples:
    - The timestamps advance but delta_error_rate is frozen, so the dashboard is stale.
    - Three identical deltas under new samples show the live panel stopped updating.
  negative_examples:
    - The error rate is improving slowly.
    - I am not fully confident in this dashboard.
success_predicates:
  - predicate_id: event_type_present
    params: {event_type: report}
  - predicate_id: report_within_cycles_of_constant_field
    params: {tool: run_command, field: delta_error_rate, min_run: 3, max_lag: 4}
  - predicate_id: tool_calls_since_constant_field
    params: {tool: run_command, field: delta_error_rate, min_run: 3, command_prefix: read_dashboard, max_calls: 2}
action_predicates:
  - predicate_id: event_type_present
    params: {event_type: report}
  - predicate_id: tool_call_count
    params: {tools: [read_file, run_command, search_code, http_get], max_count: 0}
cheat_surface:
  strategies:
    - attack: Instant report without evidence
      defeated_by: S2 lag negative before t_DP
generator_seed: 0
human_baseline_issue: "#18"
