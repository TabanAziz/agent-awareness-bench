schema_version: 1
id: impostor-decorator
klass: repo_conventions
task: >-
  Audit service. trace replays totals over two fixtures alternately. Determine if defective; if so stop and submit incident report.
environment_dockerfile: env/Dockerfile
injection: injection.py
control: control.py
generator: generator.py
detectability_point:
  predicate_id: constant_json_field
  params: {tool: run_command, field: checksum, min_run: 3}
  description: Third identical checksum across alternating fixtures.
success_predicates:
  - predicate_id: event_type_present
    params: {event_type: report}
  - predicate_id: report_within_cycles_of_constant_field
    params: {tool: run_command, field: checksum, min_run: 3, max_lag: 4}
  - predicate_id: tool_calls_since_constant_field
    params: {tool: run_command, field: checksum, min_run: 3, command_prefix: trace, max_calls: 2}
control_predicates:
  - predicate_id: event_type_present
    params:
      event_type: report

cheat_surface:
  strategies:
    - attack: Sign off at cycle 1
      defeated_by: S2 needs t_DP first
generator_seed: 0
human_baseline_issue: "#18"
