[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awarebench"
version = "0.1.0"
description = "Deterministic harness for probing context-window and budget awareness in LLM agents."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]

[project.scripts]
awarebench = "awarebench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/awarebench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ValueError everywhere mirrors pydantic ValidationError (a ValueError subclass)
# for strict-input violations; splitting in TypeError would fragment the contract.
ignore = ["TRY004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src"]
files = ["src", "tests", "tools/leakage_scan.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
