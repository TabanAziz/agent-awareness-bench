[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awarebench"
version = "0.1.0"
description = "Deterministic harness for probing context-window and budget awareness in LLM agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/awarebench"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
